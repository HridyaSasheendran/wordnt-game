<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WORDN'T — Type a word. Just not that letter.</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body class="home-page">

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <a href="index.html" class="logo">
            WORD<span>N</span>’T
        </a>

        <nav class="nav-links">
            <a href="howtoplay.html">HOW TO PLAY</a>

            <button class="useless-icon" id="uselessButton" title="Absolutely useless">
                ☺
            </button>
        </nav>

    </header>


    <!-- ================= FLOATING LETTERS ================= -->

    <div class="floating-letter letter-r">R</div>
    <div class="floating-letter letter-q">Q</div>
    <div class="floating-letter letter-z">Z</div>
    <div class="floating-letter letter-b">B</div>
    <div class="floating-letter letter-k">K</div>


    <!-- ================= DECORATIONS ================= -->

    <div class="sparkle sparkle-1">✦</div>
    <div class="sparkle sparkle-2">✦</div>
    <div class="sparkle sparkle-3">✦</div>
    <div class="sparkle sparkle-4">✦</div>

    <div class="cross-decoration">×</div>

    <div class="planet">
        ◯
    </div>


    <!-- ================= MAIN HERO ================= -->

    <main class="hero">

        <div class="crown">♕</div>

        <h1 class="main-title">
            W<span>O</span>RDN’T
        </h1>

        <p class="tagline">
            Type a word. just not that letter.
        </p>

        <p class="sub-tagline">
            Your vocabulary is about to be unnecessarily challenged.
        </p>


        <!-- PLAY BUTTON -->

        <a href="play.html" class="play-button">

            <span class="play-icon">▶</span>

            <span>PLAY NOW</span>

        </a>


        <!-- useless fact -->

        <div class="useless-fact">

            <div class="tape"></div>

            <p>
                Fun fact:
                <br>
                Your brain is
                <br>
                already tired.
                <br>
                This game will
                <br>
                make it worse.
            </p>

            <div class="tiny-face">
                :)
            </div>

        </div>


        <!-- ================= POTATO ================= -->

        <div class="potato-container" id="potato">

            <div class="potato-crown">♕</div>

            <div class="potato">
                <div class="potato-face">

                    <span class="eye left-eye"></span>
                    <span class="eye right-eye"></span>

                    <span class="potato-mouth">⌣</span>

                </div>

                <div class="potato-arm left-arm"></div>
                <div class="potato-arm right-arm"></div>

            </div>

            <div class="potato-caption">
                just a potato...
                <br>
                with dreams
            </div>

        </div>


        <!-- ================= BOTTOM MESSAGE ================= -->

        <div class="bottom-message">

            <div class="message-line">
                <span></span>
                ♡
                <span></span>
            </div>

        </div>

    </main>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="script.js"></script>

</body>

</html>
